<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QueueCut - Student ID Payment</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="phone-frame">
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />    
    <!-- Top Header -->
    <div class="app-header">
      <button onclick="window.location.href='menu.html'" style="background:none; border:none; font-weight:800; color:var(--forest-green); cursor:pointer; font-size:0.9rem;">
        ← Back
      </button>
      <span style="font-weight:800; color:var(--forest-green); font-size:0.95rem;">Student ID Checkout</span>
      <span style="width:40px;"></span>
    </div>

    <div class="menu-scroll" style="padding-bottom: 110px;">
      
      <!-- Digital School ID Card Preview -->
      <div class="id-card-visual">
        <div class="id-card-top">
          <span id="pay-school-name">GEMS WORLD ACADEMY</span>
          <span class="nfc-badge">⚡ NFC TAP READY</span>
        </div>
        <div class="id-card-mid">
          <div class="avatar-circle">🎓</div>
          <div>
            <h3 id="pay-student-name">Alex Carter</h3>
            <p id="pay-student-id">ID: GWA-2948</p>
          </div>
        </div>
        <div class="id-card-bottom">
          <span>Canteen Wallet Balance</span>
          <strong>AED 125.00</strong>
        </div>
      </div>

      <!-- Order Summary Receipt -->
      <div class="section-title">
        <span>🧾 Pre-Order Summary</span>
        <span class="section-badge" id="pay-slot-badge">Lunch Break</span>
      </div>

      <div class="receipt-card">
        <div id="receipt-items">
          <!-- Populated automatically by app.js -->
        </div>
        <div class="receipt-divider"></div>
        <div class="receipt-row total-row">
          <span>Total to Deduct</span>
          <span id="receipt-total">AED 0.00</span>
        </div>
      </div>

      <p style="font-size: 0.72rem; color: var(--text-muted); text-align: center; margin-top: 12px;">
        🔒 Linked directly to your school canteen account. No cash or bank card needed.
      </p>

    </div>

    <!-- Bottom Confirm Payment Dock -->
    <div class="checkout-dock">
      <button class="btn-primary btn-lime" id="confirm-pay-btn" onclick="processStudentIDPayment()">
        Tap Student ID & Pay Now
      </button>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
