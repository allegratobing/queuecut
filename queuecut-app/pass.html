<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QueueCut - Express Pick-Up Pass</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="phone-frame">
    <div class="pass-container">
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />      
      <!-- Top Brand Header -->
      <div>
        <div class="brand-logo">
          <div class="speed-lines">
            <span></span><span></span><span></span>
          </div>
          <div class="logo-text">
            <span class="q">Queue</span><span class="c">Cut</span>
          </div>
        </div>
        <p style="font-size: 0.78rem; font-weight: 800; color: var(--forest-green); letter-spacing: 0.8px; margin-top: 4px;">
          EXPRESS PICK-UP PASS
        </p>
      </div>

      <!-- Main Pass Card -->
      <div class="pass-card">
        <span class="section-badge">✓ PAID VIA STUDENT ID</span>
        
        <!-- Dynamic QR Code -->
        <div class="qr-box">
          <img id="pass-qr" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=QueueCut-Express-Pass" alt="Express QR Code" />
        </div>

        <!-- Assigned Express Counter / Locker -->
        <div class="locker-badge">
          <span>EXPRESS COUNTER / LOCKER</span>
          <strong id="locker-num">EXP-07</strong>
        </div>

        <!-- Student Info & Pick-up Time -->
        <p style="font-size: 0.9rem; font-weight: 800; color: var(--forest-green);" id="pass-student-name">
          Alex Carter
        </p>
        <p style="font-size: 0.74rem; font-weight: 600; color: var(--text-muted); margin-top: 2px;" id="pass-slot">
          Lunch Break • Est. Wait: &lt; 1 min
        </p>

        <!-- Order Summary Breakdown -->
        <div class="order-summary-mini" id="pass-items-list">
          <strong>Order Summary:</strong><br/>
          • Loading order...
        </div>
      </div>

      <!-- Return to Homepage (menu.html) Button -->
      <button class="btn-primary btn-lime" onclick="returnToMenu()">
        ← Back to Today's Menu
      </button>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
